[project]
name = "starter-lakehouse"
version = "0.1.0"
description = "Databricks lakehouse project scaffolded by tramat"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "databricks-connect==16.4.*",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/starter_lakehouse"]

[tool.uv]
package = true

[dependency-groups]
dev = [
    "ruff>=0.8.0",
    "mypy>=1.14.0",
    "pytest>=8.0.0",
    "pytest-cov>=6.0.0",
    "pre-commit>=4.0.0",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
extend-select = ["I"]
# broad `except Exception` around dbutils probing is deliberate (see src/env.py)
ignore = ["BLE001"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["src"]

[tool.coverage.report]
# mirrors conventions.qa.coverage_min in tramat.yml
fail_under = 30
show_missing = true
skip_empty = true
