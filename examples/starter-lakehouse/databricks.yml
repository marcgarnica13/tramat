# Canonical DAB skeleton — a proven starting point, not a contract.
# Adapt freely; keep tramat.yml's conventions in sync with what you change.
bundle:
  name: starter-lakehouse

include:
  - resources/*.yml

# gitignored files are never synced, so no sync.exclude needed here; add one
# only for tracked-but-workspace-irrelevant paths.
artifacts:
  default:
    type: whl
    dynamic_version: true
    build: uv build
    path: .

# Pin the job identity. Without this, run_as is whatever identity last
# deployed — jobs created by a since-deactivated employee then break every
# subsequent deploy.
run_as:
  service_principal_name: sp-starter-bundles

# No workspace.host pinned in this example: the CLI resolves it from your
# profile (--profile / DATABRICKS_HOST). A real repo should pin its hosts:
# workspace:
#   host: https://<your-workspace>.cloud.databricks.com

# Deployments live under /Shared (team bundles run as a service principal,
# not a person) — that is intentional, so the workspace-users grant is
# explicit. Restrict here if your workspace needs it.
permissions:
  - level: CAN_MANAGE
    group_name: users

variables:
  CATALOG:
    description: Unity Catalog for this deployment (catalog = environment)
    default: starter_dev
  DEPLOYMENT_ENV:
    description: Deployment environment name, exported to tasks
    default: ${bundle.target}

targets:
  dev:
    default: true
    workspace:
      root_path: /Shared/.bundle/dev/${bundle.name}
    variables:
      CATALOG: starter_dev
  staging:
    workspace:
      root_path: /Shared/.bundle/staging/${bundle.name}
    variables:
      CATALOG: starter_staging
  prod:
    mode: production
    workspace:
      root_path: /Shared/.bundle/prod/${bundle.name}
    variables:
      CATALOG: starter
