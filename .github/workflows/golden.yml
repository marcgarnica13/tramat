# Golden check: the starter example — the reference material /tramat:init
# composes new repos from — must be green at Tier 0 (ruff / format / mypy /
# pytest + doctor). `bundle validate` additionally runs when validate-only
# workspace secrets are configured (DATABRICKS_HOST / DATABRICKS_CLIENT_ID /
# DATABRICKS_CLIENT_SECRET); the example pins no host, so the CLI resolves
# the workspace from those env vars. Everything else needs no workspace.
name: golden

on:
  pull_request:
  push:
    branches: [main]

jobs:
  golden:
    runs-on: ubuntu-latest
    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
      DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
    defaults:
      run:
        working-directory: examples/starter-lakehouse
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync
      - run: uv run ruff check . && uv run ruff format --check .
      - run: uv run mypy src
      - run: uv run pytest
      - name: doctor (repo checks)
        working-directory: .
        run: uv run --no-project --with pyyaml python scripts/doctor.py --repo-only examples/starter-lakehouse
      - uses: databricks/setup-cli@main
        if: env.DATABRICKS_HOST != ''
      - name: bundle validate
        if: env.DATABRICKS_HOST != ''
        run: databricks bundle validate
